{% extends "base.html" %}
{% block title %}Supprimer la prédiction{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8 text-center">
    <h1 class="text-xl font-bold mb-4">Supprimer cette prédiction ?</h1>
    <p class="text-slate-600 mb-6">
        {{ prediction.home_team.name }} vs {{ prediction.away_team.name }}
        ({{ prediction.created_at|date:"d/m/Y" }})
    </p>
    <form method="post" class="flex gap-3 justify-center">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Supprimer</button>
        <a href="{% url 'matches:history' %}" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded">Annuler</a>
    </form>
</div>

{% endblock %}
