{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}

<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8">
    <h1 class="text-2xl font-bold mb-6">Connexion</h1>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="bg-red-100 text-red-900 p-3 rounded text-sm">
                {{ form.non_field_errors }}
            </div>
        {% endif %}
        <div>
            <label class="block text-sm font-medium mb-1">Nom d'utilisateur</label>
            <input type="text" name="username" required class="w-full border border-slate-300 rounded px-3 py-2">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Mot de passe</label>
            <input type="password" name="password" required class="w-full border border-slate-300 rounded px-3 py-2">
        </div>
        <button type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded font-medium">
            Se connecter
        </button>
    </form>

    <p class="mt-4 text-sm text-center text-slate-600">
        Pas encore de compte ? <a href="{% url 'accounts:register' %}" class="text-emerald-600 hover:underline">S'inscrire</a>
    </p>
</div>

{% endblock %}
